    <!-- Keep in sync with siteConfig.pageMeta.home in src/config.ts: useDocumentMeta

         both absolute tags below with your domain once it is live. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mihir Yanamandra" />
    <meta property="og:title" content="Mihir Yanamandra — Data Engineer" />

      property="og:description"
      content="Data engineer building scalable platforms in Python, SQL, PySpark, Databricks, Snowflake and dbt."
